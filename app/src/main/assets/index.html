*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#05060a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.app{position:relative;width:1280px;height:720px;transform-origin:0 0;overflow:hidden}
body[data-theme="carplay"] .central,body[data-theme="central"] .carplay{display:none}
.dr{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;background:rgba(5,8,20,.88);backdrop-filter:blur(18px);display:none;grid-template-columns:repeat(5,130px);grid-auto-rows:150px;justify-content:center;align-content:center;gap:10px}
.dr.on{display:grid}
.dr button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:15px}
.dr i{font-style:normal;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;font-size:44px;background:var(--c)}
.spin{animation:sp 4s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
button:active,.tap:active{transform:scale(.95)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#fff;color:#111;padding:12px 20px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;font-size:15px;max-width:90vw;text-align:center;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
.tp{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px)}
.tp button{all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-size:13px}
.tp button.on{background:#fff;color:#111}

/* ===== TEMA CENTRAL (cartões coloridos) ===== */
.central{display:grid;grid-template-columns:78px 270px 1fr;grid-template-rows:minmax(0,1fr) auto;gap:14px;padding:14px;background:linear-gradient(135deg,#2336ff,#6a3dff 55%,#3a1fb0)}
.central .card{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:26px;backdrop-filter:blur(10px);overflow:hidden}
.central .side{grid-row:1/3;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 0}
.central .side div{display:flex;flex-direction:column;gap:12px}
.central .sb{all:unset;cursor:pointer;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:26px}
.central .left{grid-row:1/3;display:grid;grid-template-rows:auto 1fr;gap:14px;min-height:0}
.central .clock{padding:18px 20px}
.central .clock b{font-size:44px;font-weight:300;display:block}
.central .clock span{color:var(--mut);font-size:14px;display:block;text-transform:capitalize}
.central .sp{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(160,80,255,.35))}
.central .sp small{align-self:flex-start;color:var(--mut)}
.central .vinyl{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#3d8bff 0 28%,#111 29% 33%,#222 34% 60%,#0c0c0f 61%);display:grid;place-items:center;font-size:32px}
.central .trk b{display:block;font-size:17px}
.central .trk span{font-size:13px;color:var(--mut)}
.central .ctl{display:flex;gap:20px;align-items:center}
.central .ctl button{all:unset;cursor:pointer;font-size:26px}
.central .ctl .pl{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:22px}

</style>
</head>
<body data-theme="central">

<!-- ===== COMUM: lógica (relógio, velocidade, música, gaveta, tema) ===== -->
<script>
var apps=[['Waze','🚗','#2fb8ff'],['Spotify','🎧','#1db954'],['Vídeos','🎬','#ff9a2f'],['GPS','📍','#2fcf7f'],['Chrome','🌐','#4c6fff'],['Loja','▶️','#7a5cff'],['Rádio','📻','#ff4d8d'],['Bluetooth','🔵','#2f6bff'],['Câmera de ré','📷','#6b7280'],['Ajustes','⚙️','#4b5563']];
document.querySelectorAll('.dr').forEach(function(d){d.innerHTML=apps.map(function(a){return '<button style="--c:'+a[2]+'" data-app="'+a[0]+'"><i>'+a[1]+'</i>'+a[0]+'</button>'}).join('');d.addEventListener('click',function(e){if(e.target===d)d.classList.remove('on')})});
var t=document.getElementById('toast'),h;
document.querySelectorAll('[data-app]').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('.dr').forEach(function(d){d.classList.remove('on')});
  go(b.dataset.app)})});
document.querySelectorAll('.gb').forEach(function(b){b.addEventListener('click',function(){b.closest('.app').querySelector('.dr').classList.toggle('on')})});
// Preenche toda a área útil. Em telas com proporção diferente, corta apenas
// o excedente em vez de deixar faixas pretas nas laterais ou em cima/baixo.
function fit(){
  var w=document.documentElement.clientWidth||innerWidth;
  var h=document.documentElement.clientHeight||innerHeight;
  var k=Math.max(w/1280,h/720);
  var x=(w-1280*k)/2;
  var y=(h-720*k)/2;
  document.querySelectorAll('.app').forEach(function(a){
    a.style.transform='translate('+x+'px,'+y+'px) scale('+k+')';
  });
}
fit();addEventListener('resize',fit);
function all(c,f){document.querySelectorAll(c).forEach(f)}
function tick(){var d=new Date(),hm=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  all('.js-clock',function(e){e.textContent=hm});
  all('.js-date',function(e){e.textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})});
  all('.js-date2',function(e){e.textContent=d.toLocaleDateString('pt-BR',{day:'numeric',month:'short'})})}
tick();setInterval(tick,10000);
try{navigator.geolocation.watchPosition(function(p){var s=p.coords.speed;if(s!=null)all('.js-spd',function(e){e.textContent=Math.round(s*3.6)})},function(){},{enableHighAccuracy:true})}catch(e){}
var on=false;
all('.js-play',function(b){b.addEventListener('click',function(){on=!on;
  all('.js-play',function(e){e.textContent=on?'⏸':'▶'});
  all('.js-vinyl',function(e){e.classList.toggle('spin',on)});
  all('.js-trk',function(e){e.textContent=on?'Tocando agora':'Nada tocando'});
  all('.js-art',function(e){e.textContent=on?'(no APK mostra a faixa e a capa reais)':'Toque em play'})})});
function setTheme(n){document.body.dataset.theme=n;all('.tp button',function(b){b.classList.toggle('on',b.dataset.t===n)});try{localStorage.setItem('tema',n)}catch(e){}}
all('.tp button',function(b){b.addEventListener('click',function(){setTheme(b.dataset.t)})});
var sv='central';try{sv=localStorage.getItem('tema')||'central'}catch(e){}
setTheme(sv==='carplay'?'carplay':'central');
</script>
<style>
.tp{display:none}.tp.show{display:flex}
.dr{grid-template-columns:repeat(6,130px);align-content:start;overflow-y:auto;padding:30px 0}
.dr button{align-self:start;width:130px}
.dr img{border-radius:22px}
.dr .l{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<script>
/* ===== PONTE COM O ANDROID (só roda dentro do APK) ===== */
function toast(m){t.textContent=m;t.classList.add('show');clearTimeout(h);h=setTimeout(function(){t.classList.remove('show')},1800)}
function go(n){
  if(!window.Android){toast('Abrindo '+n);return}
  if(n==='Ajustes'){document.querySelector('.tp').classList.toggle('show');return}
  Android.open(n)
}
(function(){
  if(!window.Android)return;
  var tp=document.querySelector('.tp'),sb=document.createElement('button');
  sb.textContent='Ajustes do Android';sb.onclick=function(){Android.open('Sistema')};tp.appendChild(sb);
  try{
    var list=JSON.parse(Android.apps());
    document.querySelectorAll('.dr').forEach(function(d){
      d.innerHTML=list.map(function(a){return '<button data-pkg="'+a.p+'"><img src="data:image/png;base64,'+a.i+'" width="92" height="92"><span class="l">'+a.l.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span></button>'}).join('');
      d.addEventListener('click',function(e){var b=e.target.closest('button[data-pkg]');if(b){d.classList.remove('on');Android.launch(b.dataset.pkg)}})
    })
  }catch(e){}
  all('.js-play',function(b){var n=b.cloneNode(true);b.parentNode.replaceChild(n,b);n.addEventListener('click',function(){Android.key('play')})});
  window.onSpeed=function(v){all('.js-spd',function(e){e.textContent=v})};
  window.onMedia=function(title,artist,playing,cover){
    all('.js-trk',function(e){e.textContent=title||'Nada tocando'});
    all('.js-art',function(e){e.textContent=artist||''});
    all('.js-play',function(e){e.textContent=playing?'\u23f8':'\u25b6'});
    all('.js-vinyl',function(e){e.classList.toggle('spin',playing)});
    all('.cover,.js-vinyl',function(e){
      e.style.backgroundImage=cover?'url(data:image/jpeg;base64,'+cover+')':'';
      e.style.backgroundSize='cover';e.style.color=cover?'transparent':''
    })
  }
})();
</script>
</body>
